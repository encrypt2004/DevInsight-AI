services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devinsight-backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
    container_name: devinsight-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend